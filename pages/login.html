
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

            input:focus {
                outline: none;
                border-color: #00bcbc;
                box-shadow: 0 0 0 2px rgba(0, 188, 188, 0.12);
            }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 10px;
            color: #008f8f;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #00bcbc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            button:hover {
                background: #009e9e;
            }

            button:disabled {
                background: #999;
                cursor: not-allowed;
            }

        .error-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            background: #ffeaea;
            color: #c62828;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

            .register-link a {
                color: #008f8f;
                text-decoration: none;
                font-weight: bold;
            }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your Online Shopping account</p>

        <div id="errorMessage"
             class="error-message"
             role="alert"
             aria-live="polite">
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>

                <a href="forgot-password.html" class="forgot-password">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register Here</a>
        </p>

    </main>



    <script type="module">
            import {
                loginCustomer,
                loginAdmin
            } from "../assets/js/services/auth-service.js";

            const ADMIN_EMAIL = "sowndhariyasugan@gmail.com";

            const loginForm = document.getElementById("loginForm");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const loginButton = document.getElementById("loginButton");

            // Validate HTML elements
            if (
                !(loginForm instanceof HTMLFormElement) ||
                !(emailInput instanceof HTMLInputElement) ||
                !(passwordInput instanceof HTMLInputElement) ||
                !(loginButton instanceof HTMLButtonElement)
            ) {
                throw new Error("Login page elements are missing or invalid.");
            }

            // Display an error message
            function displayError(message = "") {
                const errorElement = document.getElementById("errorMessage");

                if (!(errorElement instanceof HTMLDivElement)) {
                    console.error("Error message element not found.");
                    return;
                }

                errorElement.textContent = message;
                errorElement.style.display = "block";
            }

            // Clear the error message
            function clearError() {
                const errorElement = document.getElementById("errorMessage");

                if (!(errorElement instanceof HTMLDivElement)) {
                    return;
                }

                errorElement.textContent = "";
                errorElement.style.display = "none";
            }

            // Convert Firebase errors into readable messages
            function getLoginError(errorCode = "") {
                switch (errorCode) {
                    case "INVALID_LOGIN_CREDENTIALS":
                        return "Invalid email or password. Please try again.";

                    case "EMAIL_NOT_FOUND":
                        return "No account found with this email address.";

                    case "INVALID_PASSWORD":
                        return "Incorrect password. Please try again.";

                    case "USER_DISABLED":
                        return "Your account has been disabled. Contact the administrator.";

                    case "TOO_MANY_ATTEMPTS_TRY_LATER":
                        return "Too many unsuccessful attempts. Please try again later.";

                    case "NETWORK_ERROR":
                        return "Network error. Please check your internet connection.";

                    default:
                        return errorCode || "Login failed. Please try again.";
                }
            }

            // Extract a readable error code from any thrown value
            function extractErrorCode(error = new Error()) {
                if (error instanceof TypeError) {
                    return "NETWORK_ERROR";
                }

                if (error instanceof Error) {
                    return error.message;
                }

                return "UNKNOWN_ERROR";
            }

            // Handle login submission
            loginForm.addEventListener("submit", async (event) => {

                event.preventDefault();
                clearError();

                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                loginButton.disabled = true;
                loginButton.textContent = "Logging in...";

                try {

                    if (email === ADMIN_EMAIL) {

                        // Authenticate administrator
                        await loginAdmin(email, password);

                        window.location.href = "admin/dashboard.html";

                    } else {

                        // Authenticate customer
                        await loginCustomer(email, password);

                        window.location.href = "customer/products.html";
                    }

                } catch {

                    // Read the most recent error without an untyped catch parameter
                    const errorCode = extractErrorCode();

                    console.error("Login failed:", errorCode);
                    displayError(getLoginError(errorCode));

                } finally {

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                }
            });
    </script>



</body>
</html>
