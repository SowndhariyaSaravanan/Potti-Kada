<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/customer-checkout.css">
</head>
<body>
    <header class="customer-header">
        <div>
            <h2>Online Shopping</h2>
            <p>Your order history</p>
        </div>
        <nav class="customer-header-actions">
            <a class="secondary-button" href="./products.html">Continue Shopping</a>
            <a class="customer-cart-button" href="./cart.html">My Cart</a>
        </nav>
    </header>

    <main class="customer-page">
        <section class="customer-welcome">
            <h1>My Orders</h1>
            <p>View your previous purchases and order details.</p>
        </section>

        <p id="ordersMessage" class="customer-message" role="status"></p>
        <section id="ordersContainer" class="orders-list">
            <p class="customer-empty">Loading your orders...</p>
        </section>
    </main>

    <script type="module" src="../../assets/js/customer/orders.js"></script>
</body>
</html>
