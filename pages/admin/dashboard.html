
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Online Shopping</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <header>
        <h1>Online Shopping - Admin Dashboard</h1>
        <button id="logoutBtn" type="button">Logout</button>
    </header>

    <main>
        <section id="inventorySection">
            <h2>Inventory Management</h2>

            <div>
                <button id="addProductBtn" type="button">Add Product</button>

                <label for="categoryFilter">Filter by category:</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div id="productFormContainer" hidden>
                <h3 id="formTitle">Add Product</h3>

                <form id="productForm">
                    <label for="productId">Product ID</label>
                    <input id="productId" name="productId" required>

                    <label for="productTitle">Title</label>
                    <input id="productTitle" name="title" required>

                    <label for="productCategory">Category ID</label>
                    <input id="productCategory" name="categoryId" required>

                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" name="description" required></textarea>

                    <label for="productQuantity">Quantity</label>
                    <input id="productQuantity" name="quantity" type="number" min="0" required>

                    <label for="productPrice">Price</label>
                    <input id="productPrice" name="price" type="number" min="0" step="0.01" required>

                    <label for="productImage">Image URL</label>
                    <input id="productImage" name="imageUrl" type="url">

                    <button type="submit">Save Product</button>
                    <button id="cancelFormBtn" type="button">Cancel</button>
                </form>
            </div>

            <p id="message" role="status"></p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>

            <div>
                <button id="previousPageBtn" type="button" disabled>Previous</button>
                <span id="pageInfo">Page 1</span>
                <button id="nextPageBtn" type="button" disabled>Next</button>
            </div>
        </section>
    </main>

    <script type="module" src="../../assets/js/admin/dashboard.js"></script>
</body>
</html>
